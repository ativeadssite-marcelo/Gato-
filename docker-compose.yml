# =========================================================================
# GATO SaaS — orquestração local
# O app conecta ao Supabase (Postgres + Storage) via variáveis de ambiente.
# Suba com: docker compose up --build
# =========================================================================

services:
  app:
    build: .
    container_name: gato-saas
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
