[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NODE_ENV = "development"
  NPM_FLAGS = "--legacy-peer-deps --include=dev"
  CI = "false"

# Redirecionamento SPA para React Router / TanStack / rotas (/admin, /superadmin, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
